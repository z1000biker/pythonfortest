name: AmiGPT 68K v0.5 Conservative Device Debug

on:
  push:
    branches: [amigpt-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          cat amigpt-src.part_00 amigpt-src.part_01 amigpt-src.part_02 amigpt-src.part_03 \
              amigpt-src.part_04_00 amigpt-src.part_04_01 \
              amigpt-src.part_05_00 amigpt-src.part_05_01 \
              amigpt-src.part_06_00 amigpt-src.part_06_01 \
              amigpt-src.part_07_00 amigpt-src.part_07_01 > /tmp/amigpt-src.tgz.b64
          base64 -d /tmp/amigpt-src.tgz.b64 > /tmp/amigpt-src.tgz
          tar -xzf /tmp/amigpt-src.tgz
          cat amigpt-v02-overlay.part_00 amigpt-v02-overlay.part_01 amigpt-v02-overlay.part_02 amigpt-v02-overlay.part_03 > /tmp/amigpt-v02-overlay.tgz.b64
          base64 -d /tmp/amigpt-v02-overlay.tgz.b64 > /tmp/amigpt-v02-overlay.tgz
          tar -xzf /tmp/amigpt-v02-overlay.tgz -C AmiGPT68K

      - name: Apply v0.5 conservative fixes and checkpoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('AmiGPT68K/src/amiga/amiga_crypto.c')
          s=p.read_text()
          if '#include <utility/tagitem.h>' not in s:
              s=s.replace('#include <proto/amisslmaster.h>', '#include <utility/tagitem.h>\n#include <proto/amisslmaster.h>', 1)
          p.write_text(s)
          p=Path('AmiGPT68K/src/amiga/oauth_loopback.c')
          p.write_text(p.read_text().replace('INADDR_LOOPBACK','0x7f000001UL'))
          p=Path('AmiGPT68K/src/amiga/login_flow.c')
          s=p.read_text()
          if '#include <dos/dostags.h>' not in s:
              s='#include <dos/dostags.h>\n'+s
          p.write_text(s)

          p=Path('AmiGPT68K/src/amiga/main_cli.c')
          s=p.read_text()
          if '$STACK:131072' not in s:
              s=s.replace('#include <stdio.h>\n','#include <stdio.h>\n\nconst char stack_size[] = "$STACK:131072";\n',1)
          s=s.replace('AmiGPT 68K v0.2','AmiGPT 68K v0.5')
          p.write_text(s)

          for fn in ['AmiGPT68K/src/amiga/amiga_crypto.c','AmiGPT68K/src/amiga/amiga_tls.c']:
              p=Path(fn); s=p.read_text()
              if '#include <errno.h>' not in s:
                  s=s.replace('#include <stdio.h>','#include <stdio.h>\n#include <errno.h>',1)
              s=s.replace('AmiSSL_SocketBase,(ULONG)socket_base,TAG_DONE)',
                          'AmiSSL_SocketBase,(ULONG)socket_base,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE)')
              s=s.replace('AmiSSL_SocketBase,(ULONG)SocketBase,TAG_DONE)',
                          'AmiSSL_SocketBase,(ULONG)SocketBase,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE)')
              p.write_text(s)

          p=Path('AmiGPT68K/src/amiga/amiga_tls.c')
          s=p.read_text()
          s=s.replace('    SSL *ssl;\n};','    SSL *ssl;\n    int handshake_ok;\n};')
          s=s.replace('    if(c->ssl){SSL_shutdown(c->ssl);SSL_free(c->ssl);c->ssl=0;}',
                      '    if(c->ssl){if(c->handshake_ok)SSL_shutdown(c->ssl);SSL_free(c->ssl);c->ssl=0;}')
          s=s.replace('    if(SSL_connect(c->ssl)!=1){seterr(err,errcap,"TLS handshake failed");goto fail;}\n    return c;',
                      '    if(SSL_connect(c->ssl)!=1){seterr(err,errcap,"TLS handshake failed");goto fail;}\n    c->handshake_ok=1;\n    return c;')
          p.write_text(s)

          p=Path('AmiGPT68K/src/amiga/device_auth.c')
          s=p.read_text()
          s=s.replace('    if(amigpt_crypto_open(SocketBase,err,errcap)<0)goto out;\n    if(request_code(&dc,err,errcap)<0)goto out_crypto;',
                      '    puts("[device] bsdsocket open");fflush(stdout);\n    if(amigpt_crypto_open(SocketBase,err,errcap)<0)goto out;\n    puts("[device] AmiSSL crypto open");fflush(stdout);\n    puts("[device] requesting one-time code");fflush(stdout);\n    if(request_code(&dc,err,errcap)<0)goto out_crypto;\n    puts("[device] one-time code response OK");fflush(stdout);')
          s=s.replace('    while(waited<900){\n        if(amigpt_https_post_json("auth.openai.com","/api/accounts/deviceauth/token",body,&r,err,errcap)<0)return -1;',
                      '    while(waited<900){\n        printf("[poll] t=%lu request\\n",waited);fflush(stdout);\n        if(amigpt_https_post_json("auth.openai.com","/api/accounts/deviceauth/token",body,&r,err,errcap)<0){printf("[poll] transport failed: %s\\n",err);fflush(stdout);return -1;}\n        printf("[poll] HTTP %d body=%lu bytes\\n",r.status,(unsigned long)r.len);fflush(stdout);')
          p.write_text(s)

          assert 'AmiGPT 68K v0.5' in Path('AmiGPT68K/src/amiga/main_cli.c').read_text()
          assert '[poll] t=' in Path('AmiGPT68K/src/amiga/device_auth.c').read_text()
          assert 'OPENSSL_init_ssl' not in Path('AmiGPT68K/src/amiga/amiga_tls.c').read_text()
          assert 'amigpt_crypto_open(SocketBase' in Path('AmiGPT68K/src/amiga/device_auth.c').read_text()
          PY

      - name: Run portable core tests
        run: make -C AmiGPT68K clean test

      - name: Build AmigaOS 68K executables
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/AmiGPT68K:/src" -w /src \
            docker.io/amigadev/crosstools:m68k-amigaos \
            sh -c 'set -e; export PATH=/opt/m68k-amigaos/bin:$PATH; make clean; make amiga-all'

      - name: Verify v0.5 binaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,subprocess
          for n in ['AmiGPT020','AmiGPT030FPU','AmiGPT040']:
              p=Path('AmiGPT68K/build/amiga')/n
              d=p.read_bytes(); assert struct.unpack('>I',d[:4])[0]==0x3f3
              st=subprocess.check_output(['strings',str(p)],text=True,errors='ignore')
              for x in ['AmiGPT 68K v0.5','$STACK:131072','[device] requesting one-time code','[poll] HTTP']:
                  assert x in st,(n,x)
              assert 'OPENSSL_init_ssl failed' not in st
              print(n,len(d),'verified')
          PY

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for n in AmiGPT020 AmiGPT030FPU AmiGPT040; do cp AmiGPT68K/build/amiga/$n dist/; cp AmiGPT68K/build/amiga/$n.info dist/; done
          printf '%s\n' 'AmiGPT 68K v0.5 conservative diagnostic build' 'Restores v0.3 AmiSSL/TLS initialization that reached the one-time code' 'Only TLS change: SSL_shutdown runs after successful handshake' 'Adds per-poll checkpoints and HTTP status diagnostics' > dist/BUILD-VERIFIED.txt
          (cd dist && zip -9 ../AmiGPT68K-v0.5-CONSERVATIVE.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: AmiGPT68K-v0.5-CONSERVATIVE
          path: AmiGPT68K-v0.5-CONSERVATIVE.zip
          if-no-files-found: error

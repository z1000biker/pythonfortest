name: AmiGPT 68K v0.4 TLS Debug Build

on:
  push:
    branches: [amigpt-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source
        shell: bash
        run: |
          set -euo pipefail
          cat amigpt-src.part_00 amigpt-src.part_01 amigpt-src.part_02 amigpt-src.part_03 \
              amigpt-src.part_04_00 amigpt-src.part_04_01 \
              amigpt-src.part_05_00 amigpt-src.part_05_01 \
              amigpt-src.part_06_00 amigpt-src.part_06_01 \
              amigpt-src.part_07_00 amigpt-src.part_07_01 > /tmp/amigpt-src.tgz.b64
          base64 -d /tmp/amigpt-src.tgz.b64 > /tmp/amigpt-src.tgz
          tar -xzf /tmp/amigpt-src.tgz
          cat amigpt-v02-overlay.part_00 amigpt-v02-overlay.part_01 amigpt-v02-overlay.part_02 amigpt-v02-overlay.part_03 > /tmp/amigpt-v02-overlay.tgz.b64
          base64 -d /tmp/amigpt-v02-overlay.tgz.b64 > /tmp/amigpt-v02-overlay.tgz
          tar -xzf /tmp/amigpt-v02-overlay.tgz -C AmiGPT68K

      - name: Apply NDK and TLS v0.4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # NDK compatibility fixes already proven by previous builds.
          p=Path('AmiGPT68K/src/amiga/amiga_crypto.c')
          s=p.read_text()
          if '#include <utility/tagitem.h>' not in s:
              s=s.replace('#include <proto/amisslmaster.h>', '#include <utility/tagitem.h>\n#include <proto/amisslmaster.h>', 1)
          p.write_text(s)
          p=Path('AmiGPT68K/src/amiga/oauth_loopback.c')
          p.write_text(p.read_text().replace('INADDR_LOOPBACK','0x7f000001UL'))
          p=Path('AmiGPT68K/src/amiga/login_flow.c')
          s=p.read_text()
          if '#include <dos/dostags.h>' not in s:
              s='#include <dos/dostags.h>\n'+s
          p.write_text(s)

          # Main executable stack and version marker.
          p=Path('AmiGPT68K/src/amiga/main_cli.c')
          s=p.read_text()
          if '$STACK:131072' not in s:
              s=s.replace('#include <stdio.h>\n','#include <stdio.h>\n\nconst char stack_size[] = "$STACK:131072";\n',1)
          s=s.replace('AmiGPT 68K v0.2','AmiGPT 68K v0.4')
          s=s.replace('(official ChatGPT/Codex device auth)','(Codex device auth diagnostic; not final SIWC flow)')
          p.write_text(s)

          # DEVICELOGIN previously opened one global AmiSSL instance and then each
          # HTTPS request opened another. Remove the unnecessary outer instance.
          p=Path('AmiGPT68K/src/amiga/device_auth.c')
          s=p.read_text()
          s=s.replace('#include "amiga_crypto.h"\n','')
          s=s.replace('    if(amigpt_crypto_open(SocketBase,err,errcap)<0)goto out;\n','')
          s=s.replace('goto out_crypto;','goto out;')
          s=s.replace('out_crypto:\n    amigpt_crypto_close();\n','')
          p.write_text(s)

          # TLS transport: one AmiSSL opener per HTTPS connection, proper errno,
          # explicit OpenSSL init, diagnostic SSL/OpenSSL/X509 errors and no
          # SSL_shutdown() after a failed handshake.
          p=Path('AmiGPT68K/src/amiga/amiga_tls.c')
          s=p.read_text()
          if '#include <errno.h>' not in s:
              s=s.replace('#include <stdio.h>','#include <stdio.h>\n#include <errno.h>',1)
          s=s.replace('    SSL *ssl;\n};','    SSL *ssl;\n    int handshake_ok;\n};')
          s=s.replace('    if(c->ssl){SSL_shutdown(c->ssl);SSL_free(c->ssl);c->ssl=0;}',
                      '    if(c->ssl){if(c->handshake_ok)SSL_shutdown(c->ssl);SSL_free(c->ssl);c->ssl=0;}')
          s=s.replace('        AmiSSL_SocketBase,(ULONG)SocketBase,TAG_DONE)',
                      '        AmiSSL_SocketBase,(ULONG)SocketBase,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE)')
          s=s.replace('    AmiSSLBase=c->AmiSSLBase;\n    c->ctx=SSL_CTX_new(TLS_client_method());',
                      '    AmiSSLBase=c->AmiSSLBase;\n    if(OPENSSL_init_ssl(OPENSSL_INIT_SSL_DEFAULT | OPENSSL_INIT_ADD_ALL_CIPHERS | OPENSSL_INIT_ADD_ALL_DIGESTS,0)!=1){seterr(err,errcap,"OPENSSL_init_ssl failed");goto fail;}\n    c->ctx=SSL_CTX_new(TLS_client_method());')
          old='    if(SSL_connect(c->ssl)!=1){seterr(err,errcap,"TLS handshake failed");goto fail;}\n    return c;'
          new='''    {\n        int sr;\n        ERR_clear_error();\n        sr=SSL_connect(c->ssl);\n        if(sr!=1){\n            int se=SSL_get_error(c->ssl,sr);\n            unsigned long oe=ERR_get_error();\n            long vr=SSL_get_verify_result(c->ssl);\n            char obuf[160];\n            const char *vmsg=X509_verify_cert_error_string(vr);\n            if(oe){\n                ERR_error_string_n(oe,obuf,sizeof obuf);\n                snprintf(err,errcap,"TLS handshake failed: ssl=%d verify=%ld (%s) openssl=%s",se,vr,vmsg?vmsg:"?",obuf);\n            }else{\n                snprintf(err,errcap,"TLS handshake failed: ssl=%d verify=%ld (%s)",se,vr,vmsg?vmsg:"?");\n            }\n            goto fail;\n        }\n        c->handshake_ok=1;\n    }\n    return c;'''
          if old not in s:
              raise SystemExit('SSL_connect pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Keep crypto helper correct for the remaining legacy/PKCE paths.
          p=Path('AmiGPT68K/src/amiga/amiga_crypto.c')
          s=p.read_text()
          if '#include <errno.h>' not in s:
              s=s.replace('#include <stdio.h>','#include <stdio.h>\n#include <errno.h>',1)
          s=s.replace('        AmiSSL_SocketBase,(ULONG)socket_base,TAG_DONE)',
                      '        AmiSSL_SocketBase,(ULONG)socket_base,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE)')
          p.write_text(s)

          assert 'TLS handshake failed: ssl=' in Path('AmiGPT68K/src/amiga/amiga_tls.c').read_text()
          assert 'amigpt_crypto_open(SocketBase' not in Path('AmiGPT68K/src/amiga/device_auth.c').read_text()
          PY

      - name: Run portable core tests
        run: make -C AmiGPT68K clean test

      - name: Build AmigaOS 68K executables
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/AmiGPT68K:/src" -w /src \
            docker.io/amigadev/crosstools:m68k-amigaos \
            sh -c 'set -e; export PATH=/opt/m68k-amigaos/bin:$PATH; make clean; make amiga-all'

      - name: Verify v0.4 binaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,subprocess
          for n in ['AmiGPT020','AmiGPT030FPU','AmiGPT040']:
              p=Path('AmiGPT68K/build/amiga')/n
              d=p.read_bytes()
              assert struct.unpack('>I',d[:4])[0]==0x3f3
              st=subprocess.check_output(['strings',str(p)],text=True,errors='ignore')
              for x in ['AmiGPT 68K v0.4','$STACK:131072','TLS handshake failed: ssl=','OPENSSL_init_ssl failed']:
                  assert x in st,(n,x)
              print(n,len(d),'verified')
          PY

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for n in AmiGPT020 AmiGPT030FPU AmiGPT040; do cp AmiGPT68K/build/amiga/$n dist/; cp AmiGPT68K/build/amiga/$n.info dist/; done
          printf '%s\n' 'AmiGPT 68K v0.4 TLS diagnostic build' 'Fix: no nested AmiSSL instance in DEVICELOGIN' 'Fix: no SSL_shutdown after failed handshake' 'Adds SSL_get_error + X509 verify + OpenSSL error diagnostics' > dist/BUILD-VERIFIED.txt
          (cd dist && zip -9 ../AmiGPT68K-v0.4-TLSFIX.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: AmiGPT68K-v0.4-TLSFIX
          path: AmiGPT68K-v0.4-TLSFIX.zip
          if-no-files-found: error

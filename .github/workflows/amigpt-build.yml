name: AmiGPT 68K Build

on:
  push:
    branches: [amigpt-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat amigpt-src.part_00 amigpt-src.part_01 amigpt-src.part_02 amigpt-src.part_03 \
              amigpt-src.part_04_00 amigpt-src.part_04_01 \
              amigpt-src.part_05_00 amigpt-src.part_05_01 \
              amigpt-src.part_06_00 amigpt-src.part_06_01 \
              amigpt-src.part_07_00 amigpt-src.part_07_01 > /tmp/amigpt-src.tgz.b64
          echo "4e6b19738e26bd9a746461e49ce29a598e9db2d9795a2fe36fa7f6c832a3dc1c  /tmp/amigpt-src.tgz.b64" | sha256sum -c -
          base64 -d /tmp/amigpt-src.tgz.b64 > /tmp/amigpt-src.tgz
          echo "700a20733bd41303bf81237b3a4b6c5cb217e859660cac79bf99f7336cf1c71b  /tmp/amigpt-src.tgz" | sha256sum -c -
          tar -xzf /tmp/amigpt-src.tgz
          test -f AmiGPT68K/Makefile

      - name: Apply AmiGPT v0.2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat amigpt-v02-overlay.part_00 amigpt-v02-overlay.part_01 \
              amigpt-v02-overlay.part_02 amigpt-v02-overlay.part_03 > /tmp/amigpt-v02-overlay.tgz.b64
          echo "5538bcd282240bbe37360f2ebf4a4d995e78b4bbd765aa739982336fb5933712  /tmp/amigpt-v02-overlay.tgz.b64" | sha256sum -c -
          base64 -d /tmp/amigpt-v02-overlay.tgz.b64 > /tmp/amigpt-v02-overlay.tgz
          echo "302dbbcbbaa73f4c5974e8f9dde617a7cedf1e3fe6512e5421ec4d788da9b270  /tmp/amigpt-v02-overlay.tgz" | sha256sum -c -
          tar -xzf /tmp/amigpt-v02-overlay.tgz -C AmiGPT68K
          grep -q DEVICELOGIN AmiGPT68K/src/amiga/main_cli.c
          echo "v0.2 overlay applied"

      - name: Apply Amiga NDK compatibility fixes
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('AmiGPT68K/src/amiga/amiga_crypto.c')
          s=p.read_text()
          if '#include <utility/tagitem.h>' not in s:
              s=s.replace('#include <proto/amisslmaster.h>', '#include <utility/tagitem.h>\n#include <proto/amisslmaster.h>', 1)
          p.write_text(s)
          p=Path('AmiGPT68K/src/amiga/oauth_loopback.c')
          s=p.read_text().replace('INADDR_LOOPBACK','0x7f000001UL')
          p.write_text(s)
          p=Path('AmiGPT68K/src/amiga/login_flow.c')
          s=p.read_text()
          if '#include <dos/dostags.h>' not in s:
              s='#include <dos/dostags.h>\n'+s
          p.write_text(s)
          PYFIX

      - name: Fix AmiSSL stack and errno handling
        shell: bash
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path

          # AmiSSL 5.20+ can need well above the classic small Shell stack.
          p=Path('AmiGPT68K/src/amiga/main_cli.c')
          s=p.read_text()
          if '$STACK:131072' not in s:
              marker='#include <stdio.h>\n'
              if marker in s:
                  s=s.replace(marker, marker+'\nconst char stack_size[] = "$STACK:131072";\n', 1)
              else:
                  s='const char stack_size[] = "$STACK:131072";\n'+s
          p.write_text(s)

          # Match AmiSSL's official OS3 examples: give the library an errno pointer.
          for fn in ['AmiGPT68K/src/amiga/amiga_crypto.c','AmiGPT68K/src/amiga/amiga_tls.c']:
              p=Path(fn); s=p.read_text()
              if '#include <errno.h>' not in s:
                  insert='#include <stdio.h>'
                  if insert in s:
                      s=s.replace(insert, insert+'\n#include <errno.h>', 1)
                  else:
                      s='#include <errno.h>\n'+s
              if 'AmiSSL_ErrNoPtr' not in s:
                  s=s.replace('AmiSSL_SocketBase,(ULONG)socket_base,TAG_DONE',
                              'AmiSSL_SocketBase,(ULONG)socket_base,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE')
                  s=s.replace('AmiSSL_SocketBase,(ULONG)SocketBase,TAG_DONE',
                              'AmiSSL_SocketBase,(ULONG)SocketBase,\n        AmiSSL_ErrNoPtr,(ULONG)&errno,TAG_DONE')
              p.write_text(s)

          assert '$STACK:131072' in Path('AmiGPT68K/src/amiga/main_cli.c').read_text()
          print('AmiSSL stack=131072 and errno tags applied')
          PYFIX

      - name: Run portable core tests
        shell: bash
        run: |
          set -euo pipefail
          make -C AmiGPT68K clean test

      - name: Build AmigaOS 68K executables
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/AmiGPT68K:/src" \
            -w /src \
            docker.io/amigadev/crosstools:m68k-amigaos \
            sh -c 'set -e; export PATH=/opt/m68k-amigaos/bin:$PATH; command -v m68k-amigaos-gcc; m68k-amigaos-gcc --version; make clean; make amiga-all'

      - name: Verify HUNK executables and v0.3 fixes
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import struct, subprocess
          for n in ['AmiGPT020','AmiGPT030FPU','AmiGPT040']:
              p=Path('AmiGPT68K/build/amiga')/n
              data=p.read_bytes()
              if struct.unpack('>I',data[:4])[0] != 0x3f3:
                  raise SystemExit(f'not HUNK: {p}')
              out=subprocess.check_output(['strings',str(p)],text=True,errors='ignore')
              for required in ['DEVICELOGIN','api.openai.com','$STACK:131072']:
                  if required not in out:
                      raise SystemExit(f'missing {required} in {p}')
              print(n, len(data), 'HUNK OK, DEVICELOGIN + 128K stack present')
          PYVERIFY

      - name: Package executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for n in AmiGPT020 AmiGPT030FPU AmiGPT040; do
            cp "AmiGPT68K/build/amiga/$n" dist/
            cp "AmiGPT68K/build/amiga/$n.info" dist/
          done
          printf '%s\n' 'AmiGPT 68K v0.3' 'Fix: embedded $STACK:131072 for AmiSSL HTTPS' 'Fix: AmiSSL_ErrNoPtr passed to OpenAmiSSLTags' > dist/BUILD-VERIFIED.txt
          (cd dist && zip -9 ../AmiGPT68K-v0.3-stackfix.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: AmiGPT68K-v0.3-stackfix
          path: AmiGPT68K-v0.3-stackfix.zip
          if-no-files-found: error
